<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DubDub</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <img src="../icons/icon128.png" alt="" width="28" height="28" />
        </span>
        <div>
          <h1>DubDub</h1>
          <p class="lecture" id="lecture">Procurando a aula...</p>
        </div>
      </div>
      <span class="badge" id="engineBadge">--</span>
    </header>

    <main>
      <section class="card">
        <label class="label">Texto original</label>
        <div class="segmented" id="providerToggle" role="group">
          <button type="button" data-provider="deepgram">Deepgram STT</button>
          <button type="button" data-provider="google">Legendas Udemy</button>
        </div>
        <label class="field">
          <span>Voz da dublagem</span>
          <select id="ttsEngine"></select>
        </label>
        <p class="hint" id="providerHint"></p>
        <div class="warn" id="providerWarn" hidden></div>
      </section>

      <section class="card">
        <div class="status">
          <span class="dot" id="statusDot"></span>
          <span id="statusText">Parado</span>
          <span class="counter" id="statusCount"></span>
        </div>
        <div class="bar"><i id="progressBar"></i></div>
        <div class="actions">
          <button class="btn primary" id="startBtn" type="button">Dublar esta aula</button>
          <button class="btn" id="toggleBtn" type="button" disabled>Ativar no player</button>
        </div>
        <p class="hint" id="jobHint"></p>
        <p class="hint prefetch" id="prefetchHint" hidden></p>
      </section>

      <details class="card" id="advanced">
        <summary>Ajustes</summary>

        <div class="grid2">
          <label class="field">
            <span>Idioma do video</span>
            <select id="sourceLang"></select>
          </label>
          <label class="field">
            <span>Dublar para</span>
            <select id="targetLang"></select>
          </label>
        </div>

        <!--
          Os paineis de cada motor sao gerados a partir de engines.catalog.ts.
          Antes eram sete blocos escritos a mao aqui, cada um com quinze ids
          fixos que precisavam casar com uma tabela no JavaScript.
        -->
        <div id="enginePanels"></div>

        <label class="field">
          <span>Modelo de transcricao (Deepgram)</span>
          <select id="deepgramSttModel">
            <option value="nova-3">nova-3 (recomendado)</option>
            <option value="nova-2">nova-2</option>
            <option value="enhanced">enhanced</option>
          </select>
        </label>

        <label class="field">
          <span>API key do Deepgram (transcricao)</span>
          <span class="withbtn">
            <input type="password" id="deepgramApiKey" autocomplete="off" spellcheck="false" />
            <button class="btn small" id="testDeepgramKeyBtn" type="button">Testar</button>
          </span>
        </label>
        <p class="hint" id="deepgramKeyHint">
          Sem chave, o texto vem das legendas da Udemy. Nada mais deixa de funcionar.
        </p>

        <label class="field">
          <span>Volume do audio original <b id="originalVolumeValue">0%</b></span>
          <input type="range" id="originalVolume" min="0" max="100" step="5" />
        </label>

        <label class="field">
          <span>Volume da dublagem <b id="dubVolumeValue">100%</b></span>
          <input type="range" id="dubVolume" min="20" max="100" step="5" />
        </label>

        <label class="field">
          <span>Aceleracao maxima da voz <b id="maxSpeedupValue">1.25x</b></span>
          <input type="range" id="maxSpeedup" min="100" max="180" step="5" />
        </label>

        <div class="grid2">
          <label class="field">
            <span>Adiantar proximas aulas</span>
            <select id="prefetchNext">
              <option value="0">Nao adiantar</option>
              <option value="1">1 aula</option>
              <option value="2">2 aulas</option>
              <option value="3">3 aulas</option>
              <option value="5">5 aulas</option>
            </select>
          </label>
          <label class="field">
            <span>Aulas no cache</span>
            <select id="cacheMaxDubs">
              <option value="4">4</option>
              <option value="8">8</option>
              <option value="16">16</option>
              <option value="999">Sem limite</option>
            </select>
          </label>
        </div>

        <label class="check"
          ><input type="checkbox" id="autoEnable" />
          <span>Aplicar a dublagem ao abrir uma aula ja dublada</span></label
        >
        <label class="check"
          ><input type="checkbox" id="autoDub" />
          <span>Dublar automaticamente aulas novas</span></label
        >
        <label class="check"
          ><input type="checkbox" id="startFromPlayhead" />
          <span>Gerar primeiro a partir do ponto atual do video</span></label
        >
        <label class="check"
          ><input type="checkbox" id="showOverlay" />
          <span>Mostrar painel flutuante na Udemy</span></label
        >
      </details>

      <details class="card" id="cacheCard">
        <summary>Dublagens salvas <span class="counter" id="cacheCount"></span></summary>
        <ul class="dublist" id="dubList"></ul>
        <div class="actions">
          <button class="btn small" id="clearCacheBtn" type="button">Apagar tudo</button>
          <span class="hint" id="usageHint"></span>
        </div>
      </details>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
